name: poll-matchdays

# Matchday polling — Vercel Hobby cron is once-daily, insufficient (§9).
# Every 5 min through European match windows. The poller itself skips
# provider calls when no fixture is near kickoff, so most runs are DB-only.
# Matchday brief runs once at 09:00 IST (03:30 UTC).
on:
  schedule:
    - cron: '*/5 12-23 * * *'
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "$APP_URL/api/cron/poll" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

  brief:
    runs-on: ubuntu-latest
    # only the 03:30 tick (or a manual run) sends the brief
    if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - run: |
          curl -sS -X POST "$APP_URL/api/cron/brief" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
