name: poll-matchdays

# Matchday polling — Vercel Hobby cron is once-daily, insufficient (§9).
# Every 5 min from 16:30 IST to 05:25 IST (11:00–23:55 UTC), covering evening
# kickoffs through late UCL finishes plus provider lag; silent the rest of the
# day. The poller itself skips provider calls when no fixture is near kickoff,
# so most ticks are DB-only. The matchday brief runs once at 09:00 IST (03:30 UTC).
#
# The `poll` job deliberately has no `if:` guard, so it also runs on the 03:30
# UTC brief tick. That extra run is DB-only (nothing is near kickoff at 09:00
# IST), may front-load the daily schedule sync into dead time, and doubles as a
# daily "is the poller reachable and not gated?" heartbeat. Leave it.
#
# FAILURE = EMAIL + TELEGRAM DM. Both steps fail loudly when the endpoint returns
# a non-2xx status, an empty/non-JSON body, `ok:false`, or a non-empty `errors`
# array (/api/cron/poll returns HTTP 200 with {"ok":true,"errors":[...]} when a
# provider call fails). A failed job makes GitHub email the repo owner, which is
# the whole point: a green run means the automation actually did its job.
# A plain `curl -sS` exits 0 on 401/500 — that is how {"error":"unauthorized"}
# once hid under a passing step. Never go back to that.
#
# Email alone gets muted: an outage would mean up to 156 failure mails a day.
# So each job also has an `if: failure()` step that DMs the commissioner via the
# bot (Telegram sendMessage to TELEGRAM_ALERT_CHAT_ID — his private chat with the
# bot, NEVER the league group). It needs two repository secrets:
#   TELEGRAM_BOT_TOKEN      same value as on Vercel
#   TELEGRAM_ALERT_CHAT_ID  the commissioner's own Telegram user id (DM chat id)
# If either is missing the step prints a notice and exits 0 — it must never turn
# one real failure into a second, confusing one. Repeat suppression is stateless:
# the poll job alerts when the previous completed run of this workflow was NOT a
# failure (the outage just began) and then on every 12th run number (~hourly on
# the 5-minute schedule) while it continues; that lookup needs `actions: read`.
# If the lookup itself fails it alerts anyway (fail open).
#
# Scheduled workflows in a public repo are auto-disabled after 60 days without
# a push; .github/workflows/keepalive.yml exists to prevent that. Do not delete it.
on:
  schedule:
    - cron: '*/5 11-23 * * *'
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # alert step: `gh run list` on this workflow (repeat suppression)

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /api/cron/poll (fails on non-2xx, ok:false, or errors[])
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$APP_URL" ] && [ -n "$CRON_SECRET" ] || { echo "::error::APP_URL / CRON_SECRET repository secrets are not set"; exit 1; }
          body="$RUNNER_TEMP/body"   # fixed path: the Telegram alert step below reads it
          # -w '%{http_code}' works on every curl; --fail-with-body would too on
          # ubuntu-latest but this form also keeps the body for the jq checks below.
          code="$(curl -sS --max-time 300 -o "$body" -w '%{http_code}' -X POST "$APP_URL/api/cron/poll" \
                    -H "Authorization: Bearer $CRON_SECRET")" \
            || { echo "::error::curl could not reach $APP_URL/api/cron/poll"; exit 1; }
          echo "$code" > "$RUNNER_TEMP/http_code"
          echo "HTTP $code"; cat "$body"; echo
          case "$code" in
            2??) ;;
            *) echo "::error::/api/cron/poll returned HTTP $code — polling is NOT running (check CRON_SECRET / APP_URL / Vercel logs)"; exit 1 ;;
          esac
          [ -s "$body" ] || { echo "::error::/api/cron/poll returned an empty body"; exit 1; }
          jq -e '.ok == true and ((.errors // []) | length == 0)' "$body" >/dev/null \
            || { echo "::error::/api/cron/poll answered 2xx but reported a problem (ok != true, errors[] non-empty, or body not JSON)"; exit 1; }

      - name: Telegram DM alert (silent if TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID unset)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          JOB: ${{ github.job }}
        run: |
          # This step must never fail: the job is already red, a second red X only confuses.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::notice::No Telegram alert sent — add TELEGRAM_BOT_TOKEN and TELEGRAM_ALERT_CHAT_ID repository secrets to get failures as a DM."
            exit 0
          fi
          # Stateless repeat suppression: alert when the previous completed run was not a
          # failure (outage just started), then every 12th run (~hourly) while it continues.
          # If the lookup fails for any reason, alert anyway.
          prev="$(gh run list -R "$GITHUB_REPOSITORY" --workflow poll.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""' 2>/dev/null)" || prev="lookup-failed"
          case "$prev" in
            failure|timed_out|startup_failure)
              if [ $(( ${RUN_NUMBER:-0} % 12 )) -ne 0 ]; then
                echo "::notice::Previous run failed too and run #$RUN_NUMBER is not a reminder tick — Telegram alert suppressed (reminders go out on run numbers divisible by 12)."
                exit 0
              fi
              headline="still FAILING (hourly reminder)" ;;
            *) headline="FAILED" ;;
          esac
          code="$(cat "$RUNNER_TEMP/http_code" 2>/dev/null)" || code="no response"
          snippet="$(head -c 400 "$RUNNER_TEMP/body" 2>/dev/null | tr -d '\r')" || snippet=""
          text="$(printf '🚨 poll-matchdays / %s: %s\nHTTP %s\n%s\n%s' "$JOB" "$headline" "$code" "${snippet:-(no response body captured — see run log)}" "$RUN_URL")"
          curl -sS --max-time 20 -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_ALERT_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode 'link_preview_options={"is_disabled":true}' \
            && echo "Telegram alert sent." \
            || echo "::warning::Telegram alert could not be sent (wrong bot token / chat id, or api.telegram.org unreachable)"
          exit 0

  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # only the 03:30 tick (or a manual run) sends the brief
    if: github.event.schedule == '30 3 * * *' || github.event_name == 'workflow_dispatch'
    steps:
      - name: POST /api/cron/brief (fails on non-2xx or ok:false)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          [ -n "$APP_URL" ] && [ -n "$CRON_SECRET" ] || { echo "::error::APP_URL / CRON_SECRET repository secrets are not set"; exit 1; }
          body="$RUNNER_TEMP/body"   # fixed path: the Telegram alert step below reads it
          code="$(curl -sS --max-time 300 -o "$body" -w '%{http_code}' -X POST "$APP_URL/api/cron/brief" \
                    -H "Authorization: Bearer $CRON_SECRET")" \
            || { echo "::error::curl could not reach $APP_URL/api/cron/brief"; exit 1; }
          echo "$code" > "$RUNNER_TEMP/http_code"
          echo "HTTP $code"; cat "$body"; echo
          case "$code" in
            2??) ;;
            *) echo "::error::/api/cron/brief returned HTTP $code — the brief is NOT running (check CRON_SECRET / APP_URL / Vercel logs)"; exit 1 ;;
          esac
          [ -s "$body" ] || { echo "::error::/api/cron/brief returned an empty body"; exit 1; }
          # {"ok":true,"brief":false} (no fixtures today) is a pass; {"ok":false,"reason":...} is a failure.
          jq -e '.ok == true and ((.errors // []) | length == 0)' "$body" >/dev/null \
            || { echo "::error::/api/cron/brief answered 2xx but reported a problem (ok != true, or body not JSON)"; exit 1; }

      - name: Telegram DM alert (silent if TELEGRAM_BOT_TOKEN / TELEGRAM_ALERT_CHAT_ID unset)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB: ${{ github.job }}
        run: |
          # Runs once a day, so no repeat suppression. Must never fail (see poll job).
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ALERT_CHAT_ID" ]; then
            echo "::notice::No Telegram alert sent — add TELEGRAM_BOT_TOKEN and TELEGRAM_ALERT_CHAT_ID repository secrets to get failures as a DM."
            exit 0
          fi
          code="$(cat "$RUNNER_TEMP/http_code" 2>/dev/null)" || code="no response"
          snippet="$(head -c 400 "$RUNNER_TEMP/body" 2>/dev/null | tr -d '\r')" || snippet=""
          text="$(printf '🚨 poll-matchdays / %s: FAILED (the 09:00 IST matchday brief did not go out)\nHTTP %s\n%s\n%s' "$JOB" "$code" "${snippet:-(no response body captured — see run log)}" "$RUN_URL")"
          curl -sS --max-time 20 -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_ALERT_CHAT_ID" \
            --data-urlencode "text=$text" \
            --data-urlencode 'link_preview_options={"is_disabled":true}' \
            && echo "Telegram alert sent." \
            || echo "::warning::Telegram alert could not be sent (wrong bot token / chat id, or api.telegram.org unreachable)"
          exit 0
