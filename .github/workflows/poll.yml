name: poll-matchdays

# Matchday polling — Vercel Hobby cron is once-daily, insufficient (§9).
# Polls the protected route every 20 min during European match windows.
on:
  schedule:
    - cron: '*/20 12-23 * * *'
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -X POST "$APP_URL/api/cron/poll" \
            -H "Authorization: Bearer $CRON_SECRET"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
